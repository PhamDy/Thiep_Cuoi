<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Album ảnh cưới</title>
  <link rel="icon" type="image/x-icon" href="assets/img/icon_web.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --maroon: #6e1122;
      --maroon-dark: #4d0a17;
      --script-red: #a4192c;
      --ink: #3d3033;
      --cream: #fff;
      --serif: 'Playfair Display', Georgia, serif;
      --script: 'Dancing Script', cursive;
      --body: 'Be Vietnam Pro', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background: #fff;
      padding-bottom: 50px;
    }

    /* ===== HEADER ===== */

    .album-header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .album-header h1 {
      font-family: var(--script);
      font-size: 3rem;
      font-weight: 500;
      color: var(--maroon);
      line-height: 1.1;
    }

    .album-header p {
      margin-top: 8px;
      font-family: var(--serif);
      font-size: .82rem;
      letter-spacing: 2px;
      color: #8c7478;
    }

    .album-header::after {
      content: '';
      display: block;
      width: 70px;
      height: 1px;
      margin: 20px auto 0;
      background: #d8b9bf;
    }

    /* ===== BACK ===== */

    .album-back {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #fff;
      background: var(--maroon);

      text-decoration: none;
      font-size: 1.15rem;

      box-shadow: 0 5px 15px rgba(0,0,0,.18);

      transition: transform .2s ease, background .2s ease;
    }

    .album-back:hover {
      transform: translateX(-2px);
      background: var(--maroon-dark);
    }

    /* ===== GALLERY ===== */

    .album-gallery {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;

      columns: 3 280px;
      column-gap: 16px;
    }

    .album-item {
      width: 100%;
      display: block;

      margin-bottom: 16px;

      border-radius: 8px;
      overflow: hidden;

      cursor: pointer;

      background: #eee;

      break-inside: avoid;

      box-shadow: 0 5px 18px rgba(78,14,27,.10);

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .album-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(78,14,27,.18);
    }

    .album-item img {
      width: 100%;
      height: auto;

      display: block;

      transition: transform .45s ease;
    }

    .album-item:hover img {
      transform: scale(1.025);
    }

    /* ===== LIGHTBOX ===== */

    .album-lightbox {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(10,8,9,.96);

      opacity: 1;
      transition: opacity .3s ease;
    }

    .album-lightbox[hidden] {
      display: none;
    }

    .album-lightbox.is-closing {
      opacity: 0;
    }

    .album-lightbox img {
      max-width: 88vw;
      max-height: 86vh;

      object-fit: contain;

      border-radius: 6px;

      user-select: none;
      -webkit-user-drag: none;

      opacity: 0;

      transform: scale(.96);

      transition:
        opacity .35s ease,
        transform .35s ease;
    }

    .album-lightbox img.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== BUTTONS ===== */

    .lb-close,
    .lb-prev,
    .lb-next {
      position: absolute;

      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.2);

      background: rgba(255,255,255,.12);
      color: #fff;

      cursor: pointer;

      font-size: 1.3rem;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .lb-close:hover,
    .lb-prev:hover,
    .lb-next:hover {
      background: rgba(255,255,255,.25);
    }

    .lb-close {
      top: 18px;
      right: 18px;
    }

    .lb-prev {
      left: 25px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb-next {
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb-prev:hover,
    .lb-next:hover {
      transform: translateY(-50%) scale(1.06);
    }

    /* ===== COUNTER ===== */

    .lb-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      color: rgba(255,255,255,.75);

      font-size: .75rem;
      letter-spacing: 1px;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 600px) {

      .album-header {
        padding: 45px 20px 28px;
      }

      .album-header h1 {
        font-size: 2.5rem;
      }

      .album-gallery {
        width: calc(100% - 20px);

        columns: 2 150px;
        column-gap: 8px;
      }

      .album-item {
        margin-bottom: 8px;
        border-radius: 5px;
      }

      .album-back {
        top: 12px;
        left: 12px;

        width: 38px;
        height: 38px;
      }

      .album-lightbox img {
        max-width: 94vw;
        max-height: 78vh;
      }

      .lb-prev,
      .lb-next {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }

      .lb-prev {
        left: 8px;
      }

      .lb-next {
        right: 8px;
      }

      .lb-close {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
      }
    }

    .lb-thumbs {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);

    width: min(90vw, 700px);

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 5px;
    overflow-x: auto;

    z-index: 10;
    scrollbar-width: thin;
    }

    .lb-thumbs img {
    flex: 0 0 58px;
    width: 58px;
    height: 42px;

    object-fit: cover;
    border-radius: 4px;

    opacity: .5;
    cursor: pointer;

    border: 2px solid transparent;

    transition:
        opacity .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .lb-thumbs img:hover {
    opacity: .85;
    }

    .lb-thumbs img.active {
    opacity: 1;
    border-color: #e6cf94;
    transform: translateY(-2px);
    }

    @media (max-width: 600px) {
    .lb-thumbs {
        width: 94vw;
        bottom: 10px;
        gap: 5px;
    }

    .lb-thumbs img {
        flex-basis: 52px;
        width: 52px;
        height: 38px;
    }
    }
  </style>
</head>

<body>

  <!-- Quay lại thiệp -->
  <!-- <a href="index.html" class="album-back" aria-label="Quay lại">
    &#10094;
  </a> -->

  <!-- Tiêu đề -->
  <header class="album-header">
    <h1>Album ảnh cưới</h1>
    <p>NHỮNG KHOẢNH KHẮC CỦA CHÚNG MÌNH</p>
  </header>

  <!-- Toàn bộ ảnh -->
  <main class="album-gallery" id="albumGallery"></main>

  <!-- LIGHTBOX -->
  <div class="album-lightbox" id="albumLightbox" hidden>

    <button class="lb-close" id="lbClose" aria-label="Đóng">
      &#10005;
    </button>

    <button class="lb-prev" id="lbPrev" aria-label="Ảnh trước">
      &#10094;
    </button>

    <img id="lbImage" alt="Ảnh cưới">

    <div class="lb-thumbs" id="lbThumbs"></div>

    <button class="lb-next" id="lbNext" aria-label="Ảnh sau">
      &#10095;
    </button>

    <div class="lb-counter" id="lbCounter">
      1 / 1
    </div>

  </div>

  <!-- QUAN TRỌNG:
       dùng đúng file config của website -->
  <script src="/js/config.js"></script>

    <script>

    /* =========================
        ALBUM CONFIG
    ========================= */

    const gallery = [];

    const ALBUM_PATH = 'assets/img/album/';
    const MAX_ALBUM_IMAGES = 100;


    /* =========================
        LOAD ALL EXISTING IMAGES
    ========================= */

    async function loadGallery() {

        const checks = [];

        for (let i = 1; i <= MAX_ALBUM_IMAGES; i++) {

        const src = `${ALBUM_PATH}${i}.jpg`;

        checks.push(
            new Promise((resolve) => {

            const img = new Image();

            img.onload = () => resolve(src);

            img.onerror = () => resolve(null);

            img.src = src;

            })
        );

        }

        const results = await Promise.all(checks);

        results.forEach((src) => {

        if (src) {
            gallery.push(src);
        }

        });

    }


    /* =========================
        DOM
    ========================= */

    const galleryEl =
        document.getElementById('albumGallery');

    const lightbox =
        document.getElementById('albumLightbox');

    const lightboxImg =
        document.getElementById('lbImage');

    const counter =
        document.getElementById('lbCounter');

    const thumbs =
        document.getElementById('lbThumbs');


    let currentIndex = 0;


    /* =========================
        UPDATE THUMBNAILS
    ========================= */

    function updateThumbs() {

        Array.from(thumbs.children).forEach(
        (thumb, index) => {

            thumb.classList.toggle(
            'active',
            index === currentIndex
            );

        }
        );

    }


    /* =========================
        RENDER ALBUM
    ========================= */

    function renderAlbum() {

        gallery.forEach((src, index) => {

        /* ===== THUMB ===== */

        const thumb =
            document.createElement('img');

        thumb.src = src;

        thumb.alt =
            `Ảnh cưới ${index + 1}`;

        thumb.loading = 'lazy';

        thumb.decoding = 'async';


        thumb.addEventListener(
            'click',
            (e) => {

            e.stopPropagation();

            openAlbum(index);

            }
        );


        thumbs.appendChild(thumb);


        /* ===== ALBUM IMAGE ===== */

        const item =
            document.createElement('div');

        item.className =
            'album-item';


        const img =
            document.createElement('img');

        img.src = src;

        img.alt =
            `Ảnh cưới ${index + 1}`;

        img.loading = 'lazy';

        img.decoding = 'async';


        item.appendChild(img);


        item.addEventListener(
            'click',
            () => openAlbum(index)
        );


        galleryEl.appendChild(item);

        });

    }


    /* =========================
        OPEN
    ========================= */

    function openAlbum(index) {

        currentIndex = index;

        lightbox.hidden = false;

        document.body.style.overflow = 'hidden';

        lightboxImg.classList.remove('show');


        setTimeout(() => {

        lightboxImg.src =
            gallery[currentIndex];

        counter.textContent =
            `${currentIndex + 1} / ${gallery.length}`;

        updateThumbs();


        requestAnimationFrame(() => {

            lightboxImg.classList.add('show');

        });

        }, 80);

    }


    /* =========================
        CLOSE
    ========================= */

    function closeAlbum() {

        lightboxImg.classList.remove('show');


        setTimeout(() => {

        lightbox.hidden = true;

        document.body.style.overflow = '';

        }, 250);

    }


    /* =========================
        NEXT / PREV
    ========================= */

    function moveAlbum(step) {

        if (!gallery.length) return;


        currentIndex =
        (currentIndex + step + gallery.length)
        % gallery.length;


        lightboxImg.classList.remove('show');


        setTimeout(() => {

        lightboxImg.src =
            gallery[currentIndex];

        counter.textContent =
            `${currentIndex + 1} / ${gallery.length}`;

        updateThumbs();


        requestAnimationFrame(() => {

            lightboxImg.classList.add('show');

        });

        }, 160);

    }


    /* =========================
        BUTTONS
    ========================= */

    document
        .getElementById('lbClose')
        .addEventListener(
        'click',
        closeAlbum
        );


    document
        .getElementById('lbPrev')
        .addEventListener(
        'click',
        () => moveAlbum(-1)
        );


    document
        .getElementById('lbNext')
        .addEventListener(
        'click',
        () => moveAlbum(1)
        );


    /* =========================
        CLICK BACKGROUND TO CLOSE
    ========================= */

    lightbox.addEventListener(
        'click',
        (e) => {

        if (e.target === lightbox) {
            closeAlbum();
        }

        }
    );


    /* =========================
        KEYBOARD
    ========================= */

    document.addEventListener(
        'keydown',
        (e) => {

        if (lightbox.hidden) return;


        if (e.key === 'Escape') {
            closeAlbum();
        }


        if (e.key === 'ArrowLeft') {
            moveAlbum(-1);
        }


        if (e.key === 'ArrowRight') {
            moveAlbum(1);
        }

        }
    );


    /* =========================
        START
    ========================= */

    async function initAlbum() {

        await loadGallery();


        if (!gallery.length) {

        galleryEl.innerHTML =
            '<p>Chưa có ảnh trong album.</p>';

        return;

        }


        renderAlbum();

    }


    initAlbum();

    </script>

</body>
</html>
